name: StremioTV
options:
  bundleIdPrefix: com.ograbek
  deploymentTarget:
    macOS: "15.0"
    tvOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: F43U35GPD2
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit
    exactVersion: 1.1.0-n9.0.2
  SwiftLintPlugins:
    url: https://github.com/SimplyDanny/SwiftLintPlugins
    exactVersion: 0.65.1
targetTemplates:
  App:
    type: application
    sources:
      - path: app/Shared
    dependencies:
      - package: MPVKit
      - framework: build/StremioBridge.xcframework
        embed: false
    buildToolPlugins:
      - plugin: SwiftLintBuildToolPlugin
        package: SwiftLintPlugins
    info:
      properties:
        CFBundleDisplayName: Stremio TV
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.entertainment
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ograbek.stremio-tv
        PRODUCT_NAME: StremioTV
        GENERATE_INFOPLIST_FILE: NO
        DEAD_CODE_STRIPPING: YES
    scheme:
      environmentVariables:
        STREMIO_LOG_LEVEL: debug
targets:
  StremioBridge:
    type: ""
    platform: [macOS, tvOS]
    legacy:
      toolPath: /bin/bash
      arguments: "$(SRCROOT)/scripts/build-core.sh $(CONFIGURATION) $(PLATFORM_NAME)"
      passSettings: true
      workingDirectory: "$(SRCROOT)"
  StremioTV-macOS:
    templates: [App]
    platform: macOS
    sources:
      - path: app/macOS
    dependencies:
      - target: StremioBridge_macOS
    info:
      path: build/Info-macOS.plist
      properties:
        NSHighResolutionCapable: true
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development: szymon@ograbek.com (A5X4S66C7F)"
        ENABLE_HARDENED_RUNTIME: NO
  StremioTV-tvOS:
    templates: [App]
    platform: tvOS
    sources:
      - path: app/tvOS
    dependencies:
      - target: StremioBridge_tvOS
    info:
      path: build/Info-tvOS.plist
      properties:
        UILaunchScreen: {}
        UIRequiresFullScreen: true
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "3"
        # The Rust bridge ships an arm64 simulator slice only (Apple silicon hosts).
        EXCLUDED_ARCHS[sdk=appletvsimulator*]: x86_64
  # Unit tests for the pure layers. It compiles Domain and Features without the bridge or mpv,
  # so code there that reaches for an adapter fails to build.
  StremioTVTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: app/Shared/Domain
      - path: app/Shared/Features
      - path: app/Shared/Logging
      - path: app/Shared/App/LaunchOptions.swift
      - path: app/Tests
    buildToolPlugins:
      - plugin: SwiftLintBuildToolPlugin
        package: SwiftLintPlugins
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ograbek.stremio-tv.tests
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
    scheme:
      testTargets: [StremioTVTests]
  # Unit tests for the HTTP adapters, against recorded responses served by a URLProtocol stub.
  # Live tests run against the real services when STREMIO_LIVE_TESTS=1 (see scripts/test.sh).
  StremioTVAdapterTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: app/Shared/Domain
      - path: app/Shared/Logging
      - path: app/Shared/App/LaunchOptions.swift
      - path: app/Shared/Adapters/HTTP
      - path: app/Shared/Adapters/SkipDB
      - path: app/Tests/Fixtures.swift
      - path: app/AdapterTests
    buildToolPlugins:
      - plugin: SwiftLintBuildToolPlugin
        package: SwiftLintPlugins
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ograbek.stremio-tv.adapter-tests
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
    scheme:
      testTargets: [StremioTVAdapterTests]
