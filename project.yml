name: StremioTV
options:
  bundleIdPrefix: com.ograbek
  deploymentTarget:
    macOS: "15.0"
    tvOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: F43U35GPD2
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit
    exactVersion: 1.1.0-n9.0.2
targetTemplates:
  App:
    type: application
    sources:
      - path: app/Shared
    dependencies:
      - package: MPVKit
      - framework: build/StremioBridge.xcframework
        embed: false
    info:
      properties:
        CFBundleDisplayName: Stremio TV
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.entertainment
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ograbek.stremio-tv
        PRODUCT_NAME: StremioTV
        GENERATE_INFOPLIST_FILE: NO
        DEAD_CODE_STRIPPING: YES
    scheme:
      environmentVariables:
        STREMIO_LOG_LEVEL: debug
targets:
  StremioBridge:
    type: ""
    platform: [macOS, tvOS]
    legacy:
      toolPath: /bin/bash
      arguments: "$(SRCROOT)/scripts/build-core.sh $(CONFIGURATION) $(PLATFORM_NAME)"
      passSettings: true
      workingDirectory: "$(SRCROOT)"
  StremioTV-macOS:
    templates: [App]
    platform: macOS
    sources:
      - path: app/macOS
    dependencies:
      - target: StremioBridge_macOS
    info:
      path: build/Info-macOS.plist
      properties:
        NSHighResolutionCapable: true
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development: szymon@ograbek.com (A5X4S66C7F)"
        ENABLE_HARDENED_RUNTIME: NO
  StremioTV-tvOS:
    templates: [App]
    platform: tvOS
    sources:
      - path: app/tvOS
    dependencies:
      - target: StremioBridge_tvOS
    info:
      path: build/Info-tvOS.plist
      properties:
        UILaunchScreen: {}
        UIRequiresFullScreen: true
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "3"
        # The Rust bridge ships an arm64 simulator slice only (Apple silicon hosts).
        EXCLUDED_ARCHS[sdk=appletvsimulator*]: x86_64
