name: Release

on:
  push:
    branches: [main]
  # Rebuilds the ipa from the dispatched branch and attaches it to an existing release,
  # for when the release's own build failed.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the ipa to, e.g. v1.0.0
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  ipa:
    needs: release-please
    if: always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - run: xcodebuild -downloadPlatform tvOS
      - run: scripts/package-ipa.sh
      - run: gh release upload "${{ inputs.tag || needs.release-please.outputs.tag_name }}" build/Takane.ipa --clobber
        env:
          GH_TOKEN: ${{ github.token }}
