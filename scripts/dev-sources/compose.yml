# Local Jellyfin and WebDAV servers over the same generated media, for developing and verifying
# media sources. Run through scripts/dev-sources.sh, which sets DEV_SOURCES_DIR.
name: takane-dev-sources
services:
  jellyfin:
    image: jellyfin/jellyfin:12.3
    ports: ["8196:8096"]
    volumes:
      - ${DEV_SOURCES_DIR}/jellyfin/config:/config
      - ${DEV_SOURCES_DIR}/jellyfin/cache:/cache
      - ${DEV_SOURCES_DIR}/media:/media:ro
    restart: unless-stopped
  webdav:
    image: rclone/rclone:1.71
    command: serve webdav /media --addr :8080 --user takane --pass takane-dev --read-only
    ports: ["8197:8080"]
    volumes:
      - ${DEV_SOURCES_DIR}/media:/media:ro
    restart: unless-stopped
